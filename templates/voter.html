<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Poll</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 id="question-text">Waiting for poll...</h1>
        <div id="options"></div>
        <div id="message"></div>
    </div>

    <script>
        // Client-side voter ID generation
        function getOrCreateVoterId() {
            let vid = localStorage.getItem('voter_id');
            if (!vid) {
                vid = crypto.randomUUID ? crypto.randomUUID() : 'voter-' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('voter_id', vid);
            }
            return vid;
        }

        const voter_id = getOrCreateVoterId();
        let currentQuestionId = null;

        async function fetchCurrentQuestion() {
            try {
                const response = await fetch('/api/voter/current');
                const data = await response.json();

                if (data.status === 'ended' || !data.question) {
                    if (currentQuestionId !== 'ended') {
                        currentQuestionId = 'ended';
                        document.getElementById('question-text').textContent = "Poll has ended! Look at the screen for results.";
                        document.getElementById('options').innerHTML = '';
                        document.getElementById('message').textContent = '';
                        document.getElementById('message').className = '';
                    }
                    return;
                }

                if (currentQuestionId !== data.question.id) {
                    // Question has changed!
                    currentQuestionId = data.question.id;
                    renderQuestion(data.question);
                }
            } catch (err) {
                console.error("Error fetching current question", err);
            }
        }

        function renderQuestion(q) {
            document.getElementById('question-text').textContent = q.text;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = '';
            messageDiv.className = '';

            // Check if already voted for this new question
            if (localStorage.getItem('voted_' + q.id)) {
                optionsDiv.style.display = 'none';
                showSuccess("You have already voted for this question. Look at the screen for results!");
                return;
            }

            optionsDiv.style.display = 'block';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = opt;
                btn.onclick = () => vote(q.id, idx);
                optionsDiv.appendChild(btn);
            });
        }

        async function vote(question_id, option_index) {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(b => b.disabled = true);

            try {
                const response = await fetch('/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question_id, option_index, voter_id })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('voted_' + question_id, 'true');
                    showSuccess("Vote submitted successfully!");
                } else {
                    showError(data.error || "An error occurred.");
                    if (response.status !== 409) {
                        buttons.forEach(b => b.disabled = false); // Re-enable if non-duplicate error
                    } else {
                        // Was a duplicate vote (maybe voted on another tab)
                        localStorage.setItem('voted_' + question_id, 'true');
                    }
                }
            } catch (err) {
                showError("Network error. Please try again.");
                buttons.forEach(b => b.disabled = false);
            }
        }

        function showSuccess(msg) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = 'success';
            document.getElementById('options').style.display = 'none';
        }

        function showError(msg) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = 'error';
        }

        // Poll every 2 seconds
        setInterval(fetchCurrentQuestion, 2000);
        fetchCurrentQuestion(); // Initial fetch
    </script>
</body>
</html>
